# -Djava.io.tmpdir: REQUIRED on this machine. Gradle's daemon needs java.nio Selector/Pipe,
# which on JDK 16+ / Windows is built on an AF_UNIX socket pair created under java.io.tmpdir.
# AF_UNIX *bind* succeeds under %LOCALAPPDATA%\Temp here but *connect* fails with
# "Invalid argument: connect", so every Gradle build dies with
# "java.io.IOException: Unable to establish loopback connection".
# C:\gradletmp is verified working. Create it once: mkdir C:\gradletmp
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=C:/gradletmp
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
